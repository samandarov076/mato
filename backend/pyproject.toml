[project]
name = "mato-savdo-backend"
version = "0.1.0"
description = "Mato sotuvchilar uchun SaaS — backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "bcrypt>=4.1",
  "cryptography>=43",
  "pyjwt>=2.9",
  "redis>=5.0",
  "arq>=0.26",
  "pyotp>=2.9",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Bitta event loop butun sessiya uchun — baza ulanishlari puli testlar orasida qayta ishlatiladi
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
