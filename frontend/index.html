<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#23306B" />
    <meta name="description" content="Mato savdosi: sklad, sotuv, nasiya, hisobotlar" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iPhone / iPad: bosh ekranga qo'shilganda belgi va to'liq ekranli ilova ko'rinishi -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mato-savdo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>mato-savdo</title>
    <script>
      // Tanlangan rejim sahifa chizilishidan oldin qo'llanadi — yorug' fon "lip" etib ko'rinmaydi
      try {
        var theme = localStorage.getItem("mato.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
