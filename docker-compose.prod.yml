# mato-savdo — ishlab chiqarish (bitta VPS). Yo'riqnoma: docs/07-ishga-tushirish.md
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Sozlamalar .env.prod da (git'da yo'q). Lokal mashq: --env-file .env.local-prod (ichida ENV_FILE=.env.local-prod).
# Tashqariga faqat Caddy (80/443) ochiq; db va redis portlari serverda ham ochilmaydi.

# Loyiha nomi: dev `docker-compose.yml` (mato) bilan konteyner va volume'lar aralashmasin
name: mato-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app: &app
  build: ./backend
  image: mato-savdo-backend
  env_file: ${ENV_FILE:-.env.prod}
  environment:
    TZ: ${TZ:-Asia/Tashkent}
    MEDIA_DIR: /data/media
  volumes:
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  <<: *logging

services:
  db:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env.prod}
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    <<: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    <<: *logging

  backend:
    <<: *app
    # --proxy-headers + FORWARDED_ALLOW_IPS=* : haqiqiy IP Caddy yozgan X-Forwarded-For dan (port tashqariga ochiq emas)
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips="${FORWARDED_ALLOW_IPS:-*}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: arq app.worker.WorkerSettings
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    image: mato-savdo-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS kerak (.env.prod)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    <<: *logging

  backup:
    build: ./deploy/backup
    image: mato-savdo-backup
    env_file: ${ENV_FILE:-.env.prod}
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - backups:/backups
      - media:/data/media:ro
      - ./deploy/backup/conf:/conf:ro   # rclone.conf shu yerda (git'da yo'q)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    <<: *logging

  # Faqat tiklash uchun: docker compose ... run --rm restore <arxiv> <yopiq-kalit>
  restore:
    image: mato-savdo-backup
    profiles: ["restore"]
    env_file: ${ENV_FILE:-.env.prod}
    entrypoint: ["/restore.sh"]
    volumes:
      - backups:/backups
      - media:/data/media
      - ./deploy/backup/keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
  backups:
  caddy_data:
  caddy_config:
